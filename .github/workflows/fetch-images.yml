name: fetch-images
on:
  push:
    branches: [claude/projects-memory-qam8bz]
    paths: ['tools/image-requests.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 tools/fetch_images.py tools/image-requests.json
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A demos
          git commit -m "Fetch demo images" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
