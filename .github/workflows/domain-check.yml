name: domain-check
on:
  push:
    branches: [claude/projects-memory-qam8bz]
    paths: ['tools/domains.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RDAP lookup
        run: |
          : > tools/domains-result.txt
          while read -r d; do
            [ -z "$d" ] && continue
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" "https://rdap.verisign.com/com/v1/domain/$d")
            if [ "$code" = "404" ]; then echo "$d FREE" >> tools/domains-result.txt
            else echo "$d TAKEN (http $code) $(grep -o '"eventAction":"expiration","eventDate":"[^"]*"' /tmp/r.json | head -1)" >> tools/domains-result.txt; fi
          done < tools/domains.txt
          cat tools/domains-result.txt
      - name: DNS and HTTP check
        run: |
          echo "--- dns/http $(date -u +%FT%TZ)" >> tools/domains-result.txt
          while read -r d; do
            [ -z "$d" ] && continue
            a=$(dig +short A "$d" | tr '\n' ' '); w=$(dig +short A "www.$d" | tr '\n' ' '); ns=$(dig +short NS "$d" | tr '\n' ' ')
            h=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "https://$d" || true)
            echo "$d A=[$a] www=[$w] NS=[$ns] https=$h" >> tools/domains-result.txt
            t=$(curl -s -m 15 "https://$d" | tr '\n' ' ' | grep -o '<title>[^<]*</title>' | head -1)
            l=$(curl -s -m 15 "https://$d" | grep -o -i 'wa.me/[0-9]*\|tel:[+0-9]*\|lang="[a-z]*"' | sort -u | tr '\n' ' ')
            echo "$d title=$t links=$l" >> tools/domains-result.txt
          done < tools/domains.txt
          cat tools/domains-result.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/domains-result.txt
          git commit -m "Domain check result" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
